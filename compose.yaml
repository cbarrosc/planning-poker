services:
  poker:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - poker-data:/data
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
volumes:
  poker-data:
